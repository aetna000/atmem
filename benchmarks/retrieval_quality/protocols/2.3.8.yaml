{
  "format": "atmem-retrieval-quality-protocol-v1",
  "release": "2.3.8",
  "status": "question-split-frozen-model-pins-pending",
  "external_artifact_root_env": "ATMEM_BENCHMARK_ROOT",
  "maximum_complete_paid_configurations": 20,
