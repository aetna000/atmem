  "evaluation_design": {
    "total_question_ids": 451,
    "development_question_ids": 134,
    "confirmation_question_ids": 317,
    "split_fraction": "approximately 30/70, stratified by domain and official ability",
    "primary_confirmation_arm": "typed-selected-optional-intelligence, frozen once from development evidence before confirmation access",
    "primary_estimand": "paired absolute accuracy difference: primary confirmation arm minus matched official rag_query_to_slice_notes",
    "minimum_effect_percentage_points": 5,
    "interval": "95% paired bootstrap confidence interval over confirmation question IDs",
    "bootstrap_strata": "domain by official ability",
    "secondary_arm_multiplicity": "Holm correction for any additional confirmation-arm superiority claim",
    "power_note": "The 317-question confirmation partition is the largest available leakage-controlled partition after retaining 134 development questions. Its approximate 95% paired-difference half-width is about 6 percentage points when discordance is 0.30 and about 7.8 points at the worst-case discordance of 0.50. The nominal 5-point threshold therefore does not guarantee adequate power: the observed gain will generally need to be about 6 to 8 points for the lower bound to exceed zero. The interval and discordance are always reported."
  },
  "datasets": {
