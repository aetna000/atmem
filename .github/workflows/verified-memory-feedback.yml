name: Verified memory feedback contracts
on:
  pull_request:
    paths:
      - 'atmem/**'
      - 'tests/**'
      - 'scripts/check_feedback_docs.py'
      - 'docs/governed-rag-and-mcp.md'
      - 'pyproject.toml'
      - '.github/workflows/verified-memory-feedback.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: feedback-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  contracts:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / synthetic contracts only
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install only local contract-test requirements, no model extras
        run: python -m pip install -e . --no-deps pytest==9.2.0 jsonschema==4.26.0 cryptography==48.0.1
      - name: Install real recipient-crypto test extra on the reference job
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python -m pip install pqcrypto==1.0.0
      - name: Fetch and verify public immutable upgrade baseline
        run: python scripts/fetch_feedback_baseline.py --output .feedback-baseline/atmem-2.3.14.whl
      - name: Real encrypted-store and stdio client contracts
        env:
          ATMEM_FEEDBACK_BASELINE_WHEEL: .feedback-baseline/atmem-2.3.14.whl
        run: >-
          python -m pytest -q
          tests/test_feedback_actions.py tests/test_feedback_authority.py
          tests/test_feedback_baseline.py tests/test_feedback_contracts.py
          tests/test_feedback_docs.py tests/test_feedback_metrics.py
          tests/test_feedback_cli_mcp.py tests/test_feedback_dashboard.py
          tests/test_feedback_export.py tests/test_feedback_integrity.py tests/test_feedback_recovery.py
          tests/test_feedback_profiles.py tests/test_feedback_qualification.py
          tests/test_feedback_review.py tests/test_feedback_store.py
          tests/test_feedback_verification.py tests/test_governed_mcp.py
          tests/test_guarded_mcp.py tests/test_guarded_mcp_clients.py tests/test_rag_provider.py
          tests/test_rag_service.py tests/test_rule_compiler.py
          tests/test_rule_evaluator.py tests/test_rule_lifecycle.py
          tests/integration/test_feedback_journey.py tests/integration/test_feedback_published_upgrade.py
          tests/test_context_engine_governance.py tests/test_action_guard.py
          tests/test_evidence_protection.py tests/test_continuity_product.py
      - run: python scripts/check_feedback_docs.py
      - name: Remove public upgrade download
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import shutil
          path = Path('.feedback-baseline')
          if path.is_dir():
              shutil.rmtree(path)
