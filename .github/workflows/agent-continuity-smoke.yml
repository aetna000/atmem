name: Agent continuity smoke
on:
  pull_request:
    paths:
      - 'benchmarks/agent_continuity/**'
      - 'tests/benchmarking/test_agent_continuity.py'
      - 'atmem/**'
      - 'pyproject.toml'
      - '.github/workflows/agent-continuity-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' -r benchmarks/agent_continuity/requirements.txt
      - run: python -m pytest tests/benchmarking/test_agent_continuity.py -q
        env:
          LANGSMITH_TRACING: 'false'
          LANGCHAIN_TRACING_V2: 'false'
