name: Framework adapters
on:
  pull_request:
  workflow_dispatch:
jobs:
  conformance:
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python }}'}
      - run: pip install -e '.[dev]'
      - run: pytest -q tests/test_framework_adapter_conformance.py tests/test_framework_adapter_packaging.py tests/test_mcp.py
