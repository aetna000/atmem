name: ci

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e "./packages/atbot" -e ".[dev]"
      - run: pytest -q

  windows-core-smoke:
    name: Windows core smoke (Python 3.14, no Bun or OpenClaw)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install AtMem and its deterministic companion
        run: python -m pip install -e "./packages/atbot" -e ".[dev]"
      - name: Exercise imports, process-reentrant locks, remember, and recall
        shell: pwsh
        run: |
          atmem --help | Out-Null
          python -m pytest -q tests/test_locking.py tests/test_durability.py tests/test_processes.py tests/test_bun_runtime.py tests/test_dashboard_daemon.py tests/test_onboarding_services.py tests/test_windows_atomic_startup.py tests/test_continuity_product.py tests/test_continuity_tools.py tests/test_continuity_http.py
          if ($LASTEXITCODE -ne 0) { throw "Windows product smoke tests failed" }
          $database = Join-Path $env:RUNNER_TEMP "atmem-windows-smoke.db"
          atmem remember $database subject "remember that the desk plant is a fern"
          if ($LASTEXITCODE -ne 0) { throw "atmem remember failed" }
          $recalled = atmem recall $database subject "desk plant"
          if ($LASTEXITCODE -ne 0) { throw "atmem recall failed" }
          if (-not ($recalled -match "fern")) { throw "atmem recall did not return the fern record" }

  atbot-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e "./packages/atbot[dev]"
      - run: python -m pytest -q packages/atbot/tests

  latest-frameworks:
    name: Latest Pydantic AI and LangChain/LangGraph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install
          -e "./packages/atbot[dev]"
          -e ".[dev,frameworks]"
          "pydantic-ai-slim[openai]==2.36.0"
          "langchain==1.3.18"
          "langgraph==1.2.11"
      - run: python -m pip check
      - run: python -m pytest -q tests/test_framework_adapters.py packages/atbot/tests

  provider-extras:
    name: Context provider extra (${{ matrix.extra }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - extra: mem0
            test: tests/test_mem0_provider.py
          - extra: langgraph-provider
            test: tests/test_langgraph_provider.py
          - extra: pydantic-provider
            test: tests/test_pydantic_provider.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e "./packages/atbot" -e ".[dev,${{ matrix.extra }}]"
      - run: python -m pip check
      - name: Record and constrain resolved Mem0 SDK
        if: matrix.extra == 'mem0'
        run: >-
          python -c "from importlib.metadata import version;
          resolved=version('mem0ai');
          major=int(resolved.split('.', 1)[0]);
          assert major == 2, resolved;
          print(f'mem0ai={resolved}')"
      - run: python -m pytest -q tests/test_provider_runtime.py ${{ matrix.test }}

  openclaw-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/openclaw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/openclaw/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ../../packages/atbot -e ../..
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Run OpenClaw tests with visible failure annotation
        shell: bash
        run: |
          set +e
          output=$(npm test 2>&1)
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            output=${output//'%'/'%25'}
            output=${output//$'\r'/'%0D'}
            output=${output//$'\n'/'%0A'}
            echo "::error title=OpenClaw test failure::$output"
            exit "$status"
          fi
      - run: npm run smoke

  openclaw-hook-context-matrix:
    # Spec 007 Amendment A, T058. The bridge's peer range is open-ended, so
    # "supported versions" is not exhaustively testable. Test a finite matrix
    # instead — declared minimum, lockfile, and whatever `latest` resolves to —
    # and execute the premise check against each rather than recording fixtures
    # that never run. An unrecorded resolved version fails with instructions:
    # a new upstream release must be reviewed, not absorbed silently.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: min
            spec: openclaw@2026.7.1-2
          - label: lockfile
            spec: openclaw@2026.8.1
          - label: latest
            spec: openclaw@latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install ${{ matrix.spec }} in isolation
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/oc-${{ matrix.label }}"
          mkdir -p "$root/node_modules/openclaw" "$root/probe"
          cd "$root"
          npm pack "${{ matrix.spec }}" --silent >/dev/null
          tar -xzf openclaw-*.tgz -C node_modules/openclaw --strip-components=1
          resolved=$(node -p "require('./node_modules/openclaw/package.json').version")
          echo "resolved=$resolved" >> "$GITHUB_ENV"
          echo "::notice title=OpenClaw ${{ matrix.label }}::resolved $resolved"
      - name: Check hook-context premises for the ${{ matrix.label }} version
        working-directory: integrations/openclaw
        shell: bash
        run: |
          set -euo pipefail
          OPENCLAW_PROBE_DIR="$RUNNER_TEMP/oc-${{ matrix.label }}/probe" \
            node test/hook-context-compat.mjs
      - name: Record resolved version in the run summary
        if: always()
        shell: bash
        run: |
          echo "- **${{ matrix.label }}** (\`${{ matrix.spec }}\`) resolved to \`$resolved\`" \
            >> "$GITHUB_STEP_SUMMARY"

  distribution:
    runs-on: ubuntu-latest
    needs: [unit-tests, atbot-tests, latest-frameworks, provider-extras, openclaw-plugin, openclaw-hook-context-matrix]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m build packages/atbot --outdir atbot-dist
          python -m twine check dist/*
          python -m twine check atbot-dist/*
          python -m pip wheel --no-deps --wheel-dir rebuilt dist/*.tar.gz
          python -m pip wheel --no-deps --wheel-dir atbot-rebuilt atbot-dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: atbot-distributions
          path: atbot-dist/

  installed-wheel:
    runs-on: ${{ matrix.os }}
    needs: distribution
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: "3.10"}
          - {os: ubuntu-latest, python-version: "3.11"}
          - {os: ubuntu-latest, python-version: "3.12"}
          - {os: ubuntu-latest, python-version: "3.13"}
          - {os: macos-latest, python-version: "3.12"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: atbot-distributions
          path: atbot-dist
      - name: Install and exercise wheel
        run: |
          python -m pip install atbot-dist/*.whl dist/*.whl
          wheel=(dist/atmem-*.whl)
          python -m pip install "${wheel[0]}[atflows]"
          python -m pip check
          cd "$RUNNER_TEMP"
          python -c "import importlib.util; from importlib.metadata import version; assert importlib.util.find_spec('mem0') is None; assert importlib.util.find_spec('langgraph') is None; assert importlib.util.find_spec('pydantic_ai') is None; assert version('atflows') == '0.1.4b2'"
          python "$GITHUB_WORKSPACE/tools/smoke_installed_package.py"
          python "$GITHUB_WORKSPACE/tools/smoke_delegated_package.py"
          python "$GITHUB_WORKSPACE/tools/smoke_delegated_transport.py"

  installed-atflows-wheel:
    runs-on: ubuntu-latest
    needs: distribution
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: atbot-distributions
          path: atbot-dist
      - name: Exercise opt-in AtFlows handoff from default installation
        run: |
          python -m pip install atbot-dist/*.whl dist/*.whl
          python -m pip check
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/tools/smoke_atflows_handoff.py"
          python "$GITHUB_WORKSPACE/tools/smoke_atflows_delegated.py"

  installed-windows-bun-bootstrap:
    name: Installed Windows wheel and managed Bun bootstrap
    runs-on: windows-latest
    needs: distribution
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Install wheel and initialize without system Bun
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist\atmem-*.whl | Select-Object -First 1
          python -m pip install $wheel.FullName
          python -m pip check
          $env:ATMEM_HOME = Join-Path $env:RUNNER_TEMP "atmem-windows-home"
          $env:Path = (($env:Path -split ';') | Where-Object { $_ -and -not (Test-Path (Join-Path $_ 'bun.exe')) }) -join ';'
          atmem init --no-open
          if ($LASTEXITCODE -ne 0) { throw "atmem init failed" }
          $status = atmem status --json | ConvertFrom-Json
          if (-not $status.dashboard.running) { throw "AtMem dashboard did not start" }
          if (-not $status.atflows.running) { throw "AtFlows did not start" }
          if (-not $status.atflows.bun_managed_by_atmem) { throw "AtMem-managed Bun was not selected" }
          if ($status.atflows.bun_version -ne "1.4.2") { throw "unexpected Bun version" }
          atmem dashboard daemon stop

  installed-linux-bun-bootstrap:
    name: Installed wheel and managed Bun bootstrap (${{ matrix.label }})
    runs-on: ubuntu-latest
    needs: distribution
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Debian Bookworm
            image: debian:bookworm-slim
            setup: >-
              apt-get update &&
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
              ca-certificates libstdc++6 python3 python3-pip python3-venv &&
              rm -rf /var/lib/apt/lists/*
          - label: Fedora latest
            image: fedora:latest
            setup: >-
              dnf install -y ca-certificates libstdc++ python3 python3-pip &&
              dnf clean all
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install distribution Python
        run: ${{ matrix.setup }}
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Install wheel and initialize without system Bun
        shell: sh
        run: |
          set -eu
          if command -v bun >/dev/null 2>&1; then
            echo "The base image unexpectedly provides Bun; managed bootstrap was not tested." >&2
            exit 1
          fi
          python3 -m venv /tmp/atmem-wheel-env
          . /tmp/atmem-wheel-env/bin/activate
          python -m pip install dist/atmem-*.whl
          python -m pip check
          export ATMEM_HOME=/tmp/atmem-home
          atmem init --json --no-open >/tmp/atmem-init.json
          atmem status --json >/tmp/atmem-status.json
          python - <<'PY'
          import json

          with open("/tmp/atmem-status.json", encoding="utf-8") as source:
              status = json.load(source)
          assert status["dashboard"]["running"], status
          assert status["atflows"]["running"], status
          assert status["atflows"]["bun_managed_by_atmem"], status
          assert status["atflows"]["bun_version"] == "1.4.2", status
          print("installed wheel and managed Bun bootstrap passed")
          PY
          atmem dashboard daemon stop

  installed-atbot-wheel:
    runs-on: ubuntu-latest
    needs: distribution
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: atbot-distributions
          path: atbot-dist
      - name: Install and exercise AtBot wheel
        run: |
          python -m pip install atbot-dist/*.whl
          python -m pip check
          cd "$RUNNER_TEMP"
          python -c "from atbot.companion import CompanionRuntime; from atbot.config import AtBotConfig; assert CompanionRuntime(AtBotConfig(providers=[])).capabilities()['independent_agent'] is False"
