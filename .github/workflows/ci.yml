name: ci

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e "./packages/atbot" -e ".[dev]"
      - run: pytest -q

  atbot-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e "./packages/atbot[dev]"
      - run: python -m pytest -q packages/atbot/tests

  latest-frameworks:
    name: Latest Pydantic AI and LangChain/LangGraph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install
          -e "./packages/atbot[dev]"
          -e ".[dev,frameworks]"
          "pydantic-ai-slim[openai]==2.36.0"
          "langchain==1.3.18"
          "langgraph==1.2.11"
      - run: python -m pip check
      - run: python -m pytest -q tests/test_framework_adapters.py packages/atbot/tests

  provider-extras:
    name: Context provider extra (${{ matrix.extra }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - extra: mem0
            test: tests/test_mem0_provider.py
          - extra: langgraph-provider
            test: tests/test_langgraph_provider.py
          - extra: pydantic-provider
            test: tests/test_pydantic_provider.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e "./packages/atbot" -e ".[dev,${{ matrix.extra }}]"
      - run: python -m pip check
      - run: python -m pytest -q tests/test_provider_runtime.py ${{ matrix.test }}

  openclaw-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/openclaw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/openclaw/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ../../packages/atbot -e ../..
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Run OpenClaw tests with visible failure annotation
        shell: bash
        run: |
          set +e
          output=$(npm test 2>&1)
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            output=${output//'%'/'%25'}
            output=${output//$'\r'/'%0D'}
            output=${output//$'\n'/'%0A'}
            echo "::error title=OpenClaw test failure::$output"
            exit "$status"
          fi
      - run: npm run smoke

  distribution:
    runs-on: ubuntu-latest
    needs: [unit-tests, atbot-tests, latest-frameworks, provider-extras, openclaw-plugin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m build packages/atbot --outdir atbot-dist
          python -m twine check dist/*
          python -m twine check atbot-dist/*
          python -m pip wheel --no-deps --wheel-dir rebuilt dist/*.tar.gz
          python -m pip wheel --no-deps --wheel-dir atbot-rebuilt atbot-dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: atbot-distributions
          path: atbot-dist/

  installed-wheel:
    runs-on: ubuntu-latest
    needs: distribution
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: atbot-distributions
          path: atbot-dist
      - name: Install and exercise wheel
        run: |
          python -m pip install atbot-dist/*.whl dist/*.whl
          python -m pip check
          cd "$RUNNER_TEMP"
          python -c "import importlib.util; assert importlib.util.find_spec('mem0') is None; assert importlib.util.find_spec('langgraph') is None; assert importlib.util.find_spec('pydantic_ai') is None"
          python "$GITHUB_WORKSPACE/tools/smoke_installed_package.py"
          python "$GITHUB_WORKSPACE/tools/smoke_delegated_package.py"

  installed-atbot-wheel:
    runs-on: ubuntu-latest
    needs: distribution
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: atbot-distributions
          path: atbot-dist
      - name: Install and exercise AtBot wheel
        run: |
          python -m pip install atbot-dist/*.whl
          python -m pip check
          cd "$RUNNER_TEMP"
          python -c "from atbot.companion import CompanionRuntime; from atbot.config import AtBotConfig; assert CompanionRuntime(AtBotConfig(providers=[])).capabilities()['independent_agent'] is False"
