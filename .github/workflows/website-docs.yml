name: website-docs
on: [push, pull_request]
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ./packages/atbot -e '.[dev]'
      - run: python scripts/check_website_docs.py
      - run: python -m pytest -q tests/test_website_docs.py
