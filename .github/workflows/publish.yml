name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e "./packages/atbot" -e ".[dev]"
      - name: Run unit tests with one fresh-process retry
        run: python -m pytest -q || python -m pytest -q

  atbot-tests:
    name: AtBot Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e "./packages/atbot[dev]"
      - run: python -m pytest -q packages/atbot/tests

  latest-frameworks:
    name: Latest Pydantic AI and LangChain/LangGraph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install
          -e "./packages/atbot[dev]"
          -e ".[dev,frameworks]"
          "pydantic-ai-slim[openai]==2.36.0"
          "langchain==1.3.18"
          "langgraph==1.2.11"
      - run: python -m pip check
      - run: python -m pytest -q tests/test_framework_adapters.py packages/atbot/tests

  provider-extras:
    name: Context provider extra (${{ matrix.extra }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - extra: mem0
            test: tests/test_mem0_provider.py
          - extra: langgraph-provider
            test: tests/test_langgraph_provider.py
          - extra: pydantic-provider
            test: tests/test_pydantic_provider.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e "./packages/atbot" -e ".[dev,${{ matrix.extra }}]"
      - run: python -m pip check
      - run: python -m pytest -q tests/test_provider_runtime.py ${{ matrix.test }}

  openclaw-plugin:
    name: OpenClaw plugin checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/openclaw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/openclaw/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ../../packages/atbot -e ../..
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Run OpenClaw tests with visible failure annotation
        shell: bash
        run: |
          set +e
          output=$(npm test 2>&1)
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            output=${output//'%'/'%25'}
            output=${output//$'\r'/'%0D'}
            output=${output//$'\n'/'%0A'}
            echo "::error title=OpenClaw test failure::$output"
            exit "$status"
          fi
      - run: npm run smoke

  build:
    name: Build release artifacts
    needs: [unit-tests, atbot-tests, latest-frameworks, provider-extras, openclaw-plugin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install --upgrade pip build twine
      - name: Require tag to match package version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          expected = f"v{project['version']}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"release tag {actual!r} must equal {expected!r}")
          PY
      - name: Build distributions
        run: |
          python -m build
          python -m build packages/atbot --outdir atbot-dist
      - name: Check distributions
        run: |
          python -m twine check dist/*
          python -m twine check atbot-dist/*
      - name: Rebuild wheel from source distribution
        run: |
          python -m pip wheel --no-deps --wheel-dir rebuilt dist/*.tar.gz
          python -m pip wheel --no-deps --wheel-dir atbot-rebuilt atbot-dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: atbot-release-distributions
          path: atbot-dist/

  installed-atbot-wheel:
    name: AtBot Python ${{ matrix.python-version }} installed wheel
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: atbot-release-distributions
          path: atbot-dist
      - name: Install and exercise AtBot wheel
        run: |
          python -m pip install atbot-dist/*.whl
          python -m pip check
          cd "$RUNNER_TEMP"
          python -c "from atbot.companion import CompanionRuntime; from atbot.config import AtBotConfig; assert CompanionRuntime(AtBotConfig(providers=[])).capabilities()['canonical_storage'] is False"

  installed-wheel:
    name: Python ${{ matrix.python-version }} installed wheel
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: atbot-release-distributions
          path: atbot-dist
      - name: Install and exercise wheel
        run: |
          python -m pip install atbot-dist/*.whl dist/*.whl
          python -m pip check
          cd "$RUNNER_TEMP"
          python -c "import importlib.util; assert importlib.util.find_spec('mem0') is None; assert importlib.util.find_spec('langgraph') is None; assert importlib.util.find_spec('pydantic_ai') is None"
          python "$GITHUB_WORKSPACE/tools/smoke_installed_package.py"
          python "$GITHUB_WORKSPACE/tools/smoke_delegated_package.py"

  upgrade-existing:
    name: Upgrade persisted AtMem ${{ matrix.source-version }} data to 2.2.6b3
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        source-version: ["2.1.0", "2.2.3", "2.2.4", "2.2.5"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: atbot-release-distributions
          path: atbot-dist
      - name: Create an authentic persisted memory and control-plane fixture
        run: |
          python -m venv "$RUNNER_TEMP/upgrade-env"
          "$RUNNER_TEMP/upgrade-env/bin/python" -m pip install atmem==${{ matrix.source-version }}
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/upgrade-env/bin/python" "$GITHUB_WORKSPACE/tools/smoke_upgrade_from_2_1.py" create "$RUNNER_TEMP/upgrade-data"
      - name: Upgrade in place and verify identity, evidence, and recall
        run: |
          "$RUNNER_TEMP/upgrade-env/bin/python" -m pip install --upgrade atbot-dist/*.whl dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/upgrade-env/bin/python" "$GITHUB_WORKSPACE/tools/smoke_upgrade_from_2_1.py" verify "$RUNNER_TEMP/upgrade-data"

  pypi:
    name: Publish tested artifacts to PyPI
    if: github.ref_type == 'tag'
    needs: [installed-wheel, upgrade-existing]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/atmem
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  npm:
    name: Publish OpenClaw plugin to npm
    if: github.ref_type == 'tag'
    needs: [openclaw-plugin, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: integrations/openclaw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: integrations/openclaw/package-lock.json
      - name: Require a compatible plugin release line
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e '
            const pkg = require("./package.json");
            const plugin = pkg.version.match(/^(\d+\.\d+\.\d+)-beta\.(\d+)$/);
            const release = process.env.RELEASE_TAG.match(/^v(\d+\.\d+\.\d+)(?:b(\d+))?$/);
            if (!plugin || !release || plugin[1] !== release[1]) {
              throw new Error(`release ${process.env.RELEASE_TAG} is incompatible with plugin ${pkg.version}`);
            }
            if (release[2] && Number(plugin[2]) > Number(release[2])) {
              throw new Error(`plugin ${pkg.version} is newer than release ${process.env.RELEASE_TAG}`);
            }
          '
      - run: python -m pip install -e ../../packages/atbot -e ../..
      - run: npm ci
      - name: Publish plugin unless this exact version already exists
        run: |
          version=$(node -p 'require("./package.json").version')
          published=$(npm view "openclaw-memory-atmem@$version" version 2>/dev/null || true)
          if [ "$published" = "$version" ]; then
            echo "openclaw-memory-atmem@$version is already published"
          else
            npm publish --access public --provenance --tag beta
          fi

  release:
    name: Create GitHub release
    if: github.ref_type == 'tag'
    needs: [pypi, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist
      - name: Check whether the release already exists
        id: existing-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create release
        if: steps.existing-release.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          prerelease: true
          files: |
            dist/*
            docs/showcases/openclaw-memory-control-plane/atmem-openclaw-memory-control-plane.mp4
