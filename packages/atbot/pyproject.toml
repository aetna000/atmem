[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atbot"
version = "0.1.0a1"
description = "The local-first intelligence companion for AtMem."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "pydantic-ai-slim[openai]>=1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
atbot = "atbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
