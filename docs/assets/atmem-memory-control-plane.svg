<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1080" viewBox="0 0 2000 1080" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#111"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#111;stroke-width:3.5}
      .soft{fill:#f4f4f2;stroke:#111;stroke-width:3.5}
      .arrow{stroke:#111;stroke-width:3.5;fill:none;marker-end:url(#ah)}
      .icon{fill:none;stroke:#111;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
      .h{font-weight:800;fill:#111}
      .t{fill:#222}
      .lbl{fill:#444;font-size:21px;font-style:italic}
    </style>
  </defs>

  <rect width="2000" height="1080" fill="#fff"/>

  <!-- Title -->
  <text x="1000" y="92" text-anchor="middle" class="h" font-size="68">The Memory Control Plane Under Every Agent</text>
  <text x="1000" y="150" text-anchor="middle" class="t" font-size="31">Your agent observes, plans and acts. AtMem governs what it remembers and records what it did.</text>

  <!-- Agent runtime band -->
  <rect x="215" y="190" width="1570" height="372" rx="22" fill="none" stroke="#111" stroke-width="2.5" stroke-dasharray="10 9"/>
  <text x="240" y="225" class="h" font-size="22" letter-spacing="1.5">YOUR AGENT RUNTIME</text>
  <text x="560" y="225" class="t" font-size="22">OpenClaw · Pydantic AI · LangGraph · custom agent</text>

  <!-- Goal / Outcome -->
  <rect x="20" y="335" width="170" height="104" rx="16" class="box"/>
  <text x="105" y="398" text-anchor="middle" class="h" font-size="30">Goal</text>
  <rect x="1810" y="335" width="170" height="104" rx="16" class="box"/>
  <text x="1895" y="398" text-anchor="middle" class="h" font-size="30">Outcome</text>

  <!-- Stage boxes: x = 245, 630, 1015, 1400 ; width 355 -->
  <g>
    <rect x="245" y="245" width="355" height="285" rx="18" class="box"/>
    <text x="422" y="295" text-anchor="middle" class="h" font-size="30">1. PERCEIVE</text>
    <path class="icon" d="M362 370 q60 -58 120 0 q-60 58 -120 0 z"/><circle class="icon" cx="422" cy="370" r="18"/>
    <text x="422" y="455" text-anchor="middle" class="t" font-size="27">Read the request</text>
    <text x="422" y="490" text-anchor="middle" class="t" font-size="27">and current context</text>
  </g>
  <g>
    <rect x="630" y="245" width="355" height="285" rx="18" class="box"/>
    <text x="807" y="295" text-anchor="middle" class="h" font-size="30">2. PLAN</text>
    <path class="icon" d="M777 325 h48 l18 18 v70 h-66 z"/><path class="icon" d="M790 352 h40 M790 370 h40 M790 388 h40"/>
    <text x="807" y="455" text-anchor="middle" class="t" font-size="27">Reason and decide</text>
    <text x="807" y="490" text-anchor="middle" class="t" font-size="27">next steps</text>
  </g>
  <g>
    <rect x="1015" y="245" width="355" height="285" rx="18" class="box"/>
    <text x="1192" y="295" text-anchor="middle" class="h" font-size="30">3. ACT</text>
    <circle class="icon" cx="1192" cy="370" r="16"/>
    <path class="icon" d="M1192 330 v12 M1192 398 v12 M1152 370 h12 M1220 370 h12 M1164 342 l9 9 M1211 389 l9 9 M1220 342 l-9 9 M1173 389 l-9 9"/>
    <circle class="icon" cx="1192" cy="370" r="30"/>
    <text x="1192" y="455" text-anchor="middle" class="t" font-size="27">Call the model</text>
    <text x="1192" y="490" text-anchor="middle" class="t" font-size="27">and tools</text>
  </g>
  <g>
    <rect x="1400" y="245" width="355" height="285" rx="18" class="box"/>
    <text x="1577" y="295" text-anchor="middle" class="h" font-size="30">4. REFLECT</text>
    <path class="icon" d="M1545 345 a40 40 0 0 1 68 8 M1613 353 l2 -20 M1613 353 l-19 -5"/>
    <path class="icon" d="M1609 395 a40 40 0 0 1 -68 -8 M1541 387 l-2 20 M1541 387 l19 5"/>
    <text x="1577" y="455" text-anchor="middle" class="t" font-size="27">Propose what is</text>
    <text x="1577" y="490" text-anchor="middle" class="t" font-size="27">worth remembering</text>
  </g>

  <!-- Flow arrows -->
  <line class="arrow" x1="190" y1="387" x2="241" y2="387"/>
  <line class="arrow" x1="600" y1="387" x2="626" y2="387"/>
  <line class="arrow" x1="985" y1="387" x2="1011" y2="387"/>
  <line class="arrow" x1="1370" y1="387" x2="1396" y2="387"/>
  <line class="arrow" x1="1755" y1="387" x2="1806" y2="387"/>

  <!-- Runtime <-> AtMem links (AtMem bar top at y=640) -->
  <!-- Perceive: prepare down, governed context up -->
  <line class="arrow" x1="380" y1="530" x2="380" y2="636"/>
  <line class="arrow" x1="465" y1="640" x2="465" y2="534"/>
  <text x="372" y="600" text-anchor="end" class="lbl">prepare</text>
  <text x="474" y="585" class="lbl">context, only</text>
  <text x="474" y="610" class="lbl">if inject = true</text>
  <!-- Plan: model input recorded -->
  <line class="arrow" x1="807" y1="530" x2="807" y2="636"/>
  <text x="817" y="597" class="lbl">model input recorded</text>
  <!-- Act: tool calls recorded -->
  <line class="arrow" x1="1192" y1="530" x2="1192" y2="636"/>
  <text x="1202" y="585" class="lbl">model output, tool</text>
  <text x="1202" y="610" class="lbl">calls and results recorded</text>
  <!-- Reflect: candidates + receipts -->
  <line class="arrow" x1="1577" y1="530" x2="1577" y2="636"/>
  <text x="1587" y="585" class="lbl">memory candidates,</text>
  <text x="1587" y="610" class="lbl">outcome receipts</text>

  <!-- AtMem bar -->
  <rect x="140" y="640" width="1720" height="210" rx="22" class="soft"/>
  <g transform="translate(212,668) scale(0.8)">
    <ellipse class="icon" cx="35" cy="12" rx="35" ry="12"/>
    <path class="icon" d="M0 12 v66 a35 12 0 0 0 70 0 v-66 M0 34 a35 12 0 0 0 70 0 M0 56 a35 12 0 0 0 70 0"/>
  </g>
  <text x="300" y="735" class="h" font-size="46">AtMem</text>
  <line x1="470" y1="700" x2="470" y2="752" stroke="#111" stroke-width="2.5"/>
  <text x="495" y="735" class="t" font-size="27">Memory control plane: scoped, governed, auditable and reversible</text>
  <!-- inner chips -->
  <rect x="205" y="772" width="520" height="56" rx="12" class="box" stroke-width="2.5"/>
  <text x="465" y="808" text-anchor="middle" class="t" font-size="23"><tspan font-weight="700">Authority:</tspan> AtBot proposes, AtMem decides</text>
  <rect x="745" y="772" width="520" height="56" rx="12" class="box" stroke-width="2.5"/>
  <text x="1005" y="808" text-anchor="middle" class="t" font-size="23"><tspan font-weight="700">Agent Black Box:</tspan> hash-chained record per turn</text>
  <rect x="1285" y="772" width="520" height="56" rx="12" class="box" stroke-width="2.5"/>
  <text x="1545" y="808" text-anchor="middle" class="t" font-size="23"><tspan font-weight="700">Modes:</tspan> shadow → active, restore any time</text>

  <!-- Bottom boxes -->
  <g>
    <rect x="60" y="885" width="600" height="168" rx="18" class="box"/>
    <path class="icon" d="M110 945 v62 q35 -12 70 0 q35 -12 70 0 v-62 q-35 -12 -70 0 q-35 -12 -70 0 z M180 945 v62" transform="translate(150,965) scale(0.75) translate(-180,-976)"/>
    <text x="245" y="940" class="h" font-size="32">Governed recall</text>
    <text x="245" y="985" class="t" font-size="25">Scoped per user, agent, workspace;</text>
    <text x="245" y="1020" class="t" font-size="25">injected only when policy allows.</text>
  </g>
  <g>
    <rect x="700" y="885" width="600" height="168" rx="18" class="box"/>
    <path class="icon" d="M790 925 l45 16 v36 c0 26 -20 42 -45 50 c-25 -8 -45 -24 -45 -50 v-36 z"/>
    <path class="icon" d="M772 973 l13 13 l25 -27"/>
    <text x="920" y="940" class="h" font-size="32">Agent Black Box</text>
    <text x="920" y="985" class="t" font-size="25">A tamper-evident record of what</text>
    <text x="920" y="1020" class="t" font-size="25">each turn saw, injected and did.</text>
  </g>
  <g>
    <rect x="1340" y="885" width="600" height="168" rx="18" class="box"/>
    <circle class="icon" cx="1430" cy="945" r="22"/>
    <path class="icon" d="M1390 1018 c0 -30 18 -45 40 -45 c22 0 40 15 40 45 z"/>
    <text x="1540" y="940" class="h" font-size="32">Human oversight</text>
    <text x="1540" y="985" class="t" font-size="25">Operators review memory, then</text>
    <text x="1540" y="1020" class="t" font-size="25">activate or restore.</text>
  </g>
</svg>
