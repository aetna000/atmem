[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atmem"
version = "2.1.0"
description = "Host-neutral Agent Black Box and reversible memory control plane."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "aetna000", email = "aetna000@gmail.com" }]
maintainers = [{ name = "aetna000", email = "aetna000@gmail.com" }]
keywords = ["agent-black-box", "agent-memory", "audit", "mcp", "provenance", "sqlite"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]
semantic = [
  "sentence-transformers>=5.0.0,<6.0.0",
]

[project.scripts]
atmem = "atmem.cli:main"

[project.urls]
Homepage = "https://github.com/aetna000/atmem"
Repository = "https://github.com/aetna000/atmem"
Issues = "https://github.com/aetna000/atmem/issues"
Documentation = "https://github.com/aetna000/atmem#readme"

[tool.setuptools.packages.find]
include = ["atmem*"]

[tool.setuptools.package-data]
"atmem.control" = ["assets/*.jpg", "assets/*.html", "assets/*.css", "assets/*.js"]
"atmem.schemas" = ["v1/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
